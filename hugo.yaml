baseURL: https://blog.lvxinrong.com/
title: 吕炘嵘的博客
theme: PaperMod

# 站点语言。原来写的 `locale: zh-CN` 不是 Hugo 的配置键，等于没生效，
# 所以中文站点渲染出了 "September 23, 2026" / "1 min" 这类英文。
defaultContentLanguage: zh-CN

# 让 Hugo 按「字」而不是按空格统计中文。
# 不开这个，整篇长文会被算成 1 个「词」，阅读时长永远是 1 分钟。
hasCJKLanguage: true

enableRobotsTXT: true
enableEmoji: true
summaryLength: 80

pagination:
  pagerSize: 10

# 首页额外输出一份 JSON，作为搜索索引（PaperMod 的搜索靠它）
outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  zh-CN:
    # Hugo 0.158 起 languageName/languageCode 改名为 label/locale
    label: 中文
    locale: zh-CN
    weight: 1
    title: 吕炘嵘的博客
    params:
      description: 好奇，毅力，自我思考
      # 首页 Hero。
      # 分工：顶栏（params.label.text）= 态度，每页常驻；Hero = 姓名，仅首页。
      # 两处不要放同一句话 —— 首页会把它们上下紧挨着显示两遍。
      homeInfoParams:
        Title: 吕炘嵘
        Content: 好奇，毅力，自我思考

params:
  env: production
  # 固定浅色，并移除导航栏上的明暗切换按钮。
  # 这两项要一起设：只设 defaultTheme，按钮还在；
  # 只设 disableThemeToggle，主题会退回「跟随系统」。
  defaultTheme: light
  disableThemeToggle: true
  author: 吕炘嵘
  description: 好奇，毅力，自我思考

  # OG 分享卡片的兜底图（链接转发到微信/推特时显示的预览图）。
  # 查找顺序：文章 front matter 的 images → 同名资源里的 *feature*/*cover* → 这里。
  # 所以要给单篇换图，只需在那篇的 front matter 里写 images = ["xxx.jpg"]。
  images:
    - og-default.jpg

  # 文章底部评论（giscus，基于 GitHub Discussions）
  comments: true

  giscus:
    repo: lvxinrong/lv_blog
    # repoId 已从 GitHub API 取到
    repoId: R_kgDOUm86Xg
    # 你在 GitHub Discussions 里选的分类名，要和下面 ID 对应同一个
    category: Announcements
    # 已填。取法（不需要去 giscus.app）：
    #   curl -s -H "Accept: application/vnd.github+json" \
    #     https://api.github.com/repos/lvxinrong/lv_blog/discussions
    #   返回里每条的 category.node_id 就是这个值
    categoryId: "DIC_kwDOUm86Xs4DGRUM"
    # 用 og:title 而不是默认的 pathname：
    # 本站改过一次 URL，且还计划改栏目名 —— pathname 一变，已有评论就断了。
    # og:title 是文章标题（不含站名后缀），比 URL 稳定。
    mapping: og:title
    theme: light        # 站点已固定浅色
    lang: zh-CN
    title: 评论

  # 只覆盖顶栏那行字，不影响 <title> / RSS / 页脚版权
  # （那些仍用 site.Title = 吕炘嵘的博客）。
  label:
    text: 写代码，也写自己

  # 日期格式（Go 的时间布局写法）
  DateFormat: "2006年1月2日"

  # RSS 的 <language> 与 og:locale 用的语言标签。
  # 为什么不直接用模板里的 .Language.LanguageCode / .Language.Locale：
  # 这两个名字在 Hugo 0.158 前后互换了（旧名弃用、新名引入），
  # 用任一个都会让构建结果依赖 Hugo 版本 —— Cloudflare 上是 0.147.7，
  # 本地是 0.166.0，两边必须行为一致，所以取值放到配置里。
  languageTag: "zh-CN"

  mainSections:
    - llm
    - ai
    - craft

  # 阅读体验相关
  ShowReadingTime: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false

  # RSS 输出全文（否则订阅者在阅读器里只看得到摘要，得点回站内才能读）。
  # 配套改动见 layouts/rss.xml —— 那里把正文里的相对 URL 补成了绝对地址，
  # 否则阅读器里图片会全挂。
  ShowFullTextinRSS: true

  assets:
    # 现代浏览器优先用 SVG，老浏览器回落到下面默认的 png/ico
    favicon: favicon.svg
    # 浏览器地址栏配色，跟随默认的浅色底
    theme_color: "#ffffff"
    msapplication_TileColor: "#3b5bdb"

  # 首页 Hero 下方的社交图标。图标名要对应主题 svg.html 里支持的名字
  # （github / x / zhihu / juejin / bilibili / email / rss …）。
  socialIcons:
    - name: github
      title: GitHub
      url: https://github.com/lvxinrong
    - name: email
      title: 邮箱
      url: mailto:825883336@qq.com
    - name: rss
      title: RSS
      url: /index.xml

markup:
  # 主题要求 noClasses 必须为 false，否则代码高亮样式不生效
  highlight:
    noClasses: false
    # 行号默认关闭，块太短时行号是噪音；
    # 需要时在代码围栏上写 ```go {linenos=true} 单独开启。
    lineNos: false
    lineNoStart: 1
    tabWidth: 4
  # 正文里用 `#` 当章节标题，目录要从一级开始抓，否则目录是空的
  tableOfContents:
    startLevel: 1
    endLevel: 3
    ordered: false

menu:
  main:
    - name: 手搓LLM
      url: /llm/
      weight: 1
    - name: AI随想
      url: /ai/
      weight: 2
    - name: 工程手记
      url: /craft/
      weight: 3
    - name: 归档
      url: /archives/
      weight: 4
    - name: 关于
      url: /about/
      weight: 5
