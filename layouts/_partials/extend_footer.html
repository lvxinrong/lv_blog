{{- /* 站点自定义的页脚扩展（PaperMod 提供的挂载点）。 */ -}}
<script>
    /* 同一份菜单在手机上收成可展开面板；无 JS 时仍显示原生导航。 */
    (function () {
        var header = document.querySelector('.header');
        var menuButton = document.querySelector('.mobile-menu-toggle');
        if (!header || !menuButton || !window.matchMedia) return;
        var mobile = window.matchMedia('(max-width: 768px)');
        var menu = document.getElementById('menu');
        var toc = document.querySelector('details.toc');
        var tocButton = document.querySelector('.mobile-toc-toggle');
        var tocPanel = null;
        header.classList.add('has-mobile-menu');
        if (toc && tocButton) {
            /* 浮层从正文目录生成；正文布局保持原样，避免滚动锚定跳动。 */
            tocPanel = toc.cloneNode(true);
            tocPanel.id = 'article-toc';
            tocPanel.classList.add('mobile-toc-panel');
            tocPanel.querySelectorAll('[id]').forEach(function (item) { item.removeAttribute('id'); });
            tocPanel.querySelector('summary').removeAttribute('accesskey');
            tocPanel.querySelector('summary').removeAttribute('title');
            tocPanel.querySelector('summary').textContent = '文章目录 · 关闭';
            tocPanel.open = true;
            tocPanel.hidden = true;
            document.body.appendChild(tocPanel);
            header.classList.add('has-mobile-toc');
        }

        var closeMenu = function (restoreFocus) {
            header.classList.remove('is-menu-open');
            menuButton.setAttribute('aria-expanded', 'false');
            menuButton.setAttribute('aria-label', '打开导航菜单');
            if (restoreFocus) menuButton.focus({ preventScroll: true });
        };
        var closeToc = function (restoreFocus) {
            if (!tocPanel || tocPanel.hidden) return;
            tocPanel.hidden = true;
            tocButton.setAttribute('aria-expanded', 'false');
            tocButton.setAttribute('aria-label', '打开文章目录');
            if (restoreFocus) tocButton.focus({ preventScroll: true });
        };
        menuButton.addEventListener('click', function () {
            closeToc(false);
            var open = !header.classList.contains('is-menu-open');
            header.classList.toggle('is-menu-open', open);
            menuButton.setAttribute('aria-expanded', String(open));
            menuButton.setAttribute('aria-label', open ? '关闭导航菜单' : '打开导航菜单');
            /* 展开一级菜单时直接展示栏目，避免手机上再点一次分组。 */
            menu.querySelectorAll('.nav-dropdown').forEach(function (item) { item.open = open; });
        });
        menu.querySelectorAll('a').forEach(function (link) {
            link.addEventListener('click', function () { if (mobile.matches) closeMenu(false); });
        });
        if (tocPanel && tocButton) {
            tocButton.addEventListener('click', function () {
                if (!tocPanel.hidden) { closeToc(true); return; }
                closeMenu(false);
                tocPanel.hidden = false;
                tocButton.setAttribute('aria-expanded', 'true');
                tocButton.setAttribute('aria-label', '关闭文章目录');
                tocPanel.querySelector('summary').focus({ preventScroll: true });
            });
            tocPanel.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { closeToc(false); });
            });
            tocPanel.querySelector('summary').addEventListener('click', function (event) {
                event.preventDefault();
                closeToc(true);
            });
            tocPanel.addEventListener('focusout', function (event) {
                if (event.relatedTarget && !tocPanel.contains(event.relatedTarget) && event.relatedTarget !== tocButton) closeToc(false);
            });
        }
        document.addEventListener('click', function (event) {
            if (!header.contains(event.target)) closeMenu(false);
            if (tocPanel && !tocPanel.contains(event.target) && !tocButton.contains(event.target)) closeToc(false);
        });
        document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape') return;
            if (tocPanel && !tocPanel.hidden) { closeToc(true); event.preventDefault(); }
            else if (header.classList.contains('is-menu-open')) { closeMenu(true); event.preventDefault(); }
        });
        header.addEventListener('focusout', function (event) {
            if (event.relatedTarget && !header.contains(event.relatedTarget)) closeMenu(false);
        });
        var reset = function () { closeMenu(false); closeToc(false); };
        if (mobile.addEventListener) mobile.addEventListener('change', reset);
        else mobile.addListener(reset);
    })();

    /* 原生 details 支持触屏与键盘；补上外部点击、焦点离开和 Esc 收起。 */
    (function () {
        var dropdowns = document.querySelectorAll('.nav-dropdown');
        dropdowns.forEach(function (dropdown) {
            document.addEventListener('click', function (event) {
                if (!dropdown.contains(event.target) && !event.target.closest('.mobile-menu-toggle')) dropdown.open = false;
            });
            dropdown.addEventListener('focusout', function (event) {
                if (!dropdown.contains(event.relatedTarget)) dropdown.open = false;
            });
            dropdown.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && dropdown.open) {
                    dropdown.open = false;
                    dropdown.querySelector('summary').focus();
                    event.preventDefault();
                }
            });
            dropdown.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { dropdown.open = false; });
            });
        });
    })();

    /* 吸顶导航：滚动后才出现分隔线，静止时保持干净。 */
    (function () {
        var header = document.querySelector('.header');
        if (!header) return;
        var onScroll = function () {
            header.classList.toggle('is-stuck', window.scrollY > 4);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
    })();

    /* 目录：≥1280px 时它被 CSS 挪到右侧栏，这时默认展开才有意义；
       窄屏回落到内联折叠块，保持原来的行为。
       只在断点切换时同步，所以用户手动折叠的状态不会被反复覆盖。
       同时挂载滚动监听，高亮当前阅读章节。 */
    (function () {
        var toc = document.querySelector('details.toc');
        if (!toc || !window.matchMedia) return;
        var mq = window.matchMedia('(min-width: 1280px)');
        var sync = function (matches) { toc.open = matches; };
        sync(mq.matches);
        var onChange = function (e) { sync(e.matches); };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);

        var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
        var items = [];
        links.forEach(function (link) {
            var raw = link.getAttribute('href').slice(1);
            if (!raw) return;
            var id = raw;
            try { id = decodeURIComponent(raw); } catch (e) {}
            var target = document.getElementById(id);
            if (target) items.push({ link: link, target: target, href: link.getAttribute('href') });
        });
        if (!items.length) return;

        var mobilePanel = document.getElementById('article-toc');
        var mobileLinks = mobilePanel ? Array.prototype.slice.call(mobilePanel.querySelectorAll('a[href^="#"]')) : [];
        var activeHref = '';
        var ticking = false;

        var updateActive = function () {
            ticking = false;
            var threshold = 116;
            var current = items[0];
            for (var i = 0; i < items.length; i++) {
                if (items[i].target.getBoundingClientRect().top <= threshold) {
                    current = items[i];
                } else {
                    break;
                }
            }
            var nextHref = current ? current.href : '';
            if (nextHref === activeHref) return;
            activeHref = nextHref;
            items.forEach(function (item) {
                item.link.classList.toggle('is-active', item.href === activeHref);
            });
            mobileLinks.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('href') === activeHref);
            });
        };

        window.addEventListener('scroll', function () {
            if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(updateActive);
            }
        }, { passive: true });
        updateActive();
    })();

    /* 本站覆盖的 footer 未带入主题脚本，因此在扩展挂载点补回明暗切换。 */
    (function () {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        toggle.addEventListener('click', function () {
            var root = document.documentElement;
            var theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = theme;
            localStorage.setItem('pref-theme', theme);
        });
    })();

    /* 没有手动偏好时持续跟随系统；一旦使用顶栏切换，就尊重本地选择。 */
    (function () {
        if (!window.matchMedia || {{ ne (site.Params.defaultTheme | default "auto") "auto" }}) return;
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
        var follow = function (event) {
            if (!localStorage.getItem('pref-theme')) {
                document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
            }
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', follow);
        else systemTheme.addListener(follow);
    })();

    /* giscus 首次加载跟随系统，之后与站点的手动切换保持同步。 */
    (function () {
        var root = document.documentElement;
        var sync = function () {
            var frame = document.querySelector('iframe.giscus-frame');
            if (!frame) return;
            var theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
            frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
        };
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
        var comments = document.getElementById('comments');
        if (comments) new MutationObserver(sync).observe(comments, { childList: true, subtree: true });
        document.addEventListener('load', function (event) {
            if (event.target instanceof Element && event.target.matches('iframe.giscus-frame')) sync();
        }, true);
        sync();
    })();
</script>
