{{- /* 站点自定义的页脚扩展（PaperMod 提供的挂载点）。 */ -}}
<script>
    /* 同一份菜单在手机上收成可展开面板；无 JS 时仍显示原生导航。 */
    (function () {
        var header = document.querySelector('.header');
        var menuButton = document.querySelector('.mobile-menu-toggle');
        if (!header || !menuButton || !window.matchMedia) return;
        var mobile = window.matchMedia('(max-width: 768px)');
        var menu = document.getElementById('menu');
        var toc = document.querySelector('details.toc');
        var tocButton = document.querySelector('.mobile-toc-toggle');
        var tocPanel = null;
        header.classList.add('has-mobile-menu');
        if (toc && tocButton) {
            /* 浮层从正文目录生成；正文布局保持原样，避免滚动锚定跳动。 */
            tocPanel = toc.cloneNode(true);
            tocPanel.id = 'article-toc';
            tocPanel.classList.add('mobile-toc-panel');
            tocPanel.querySelectorAll('[id]').forEach(function (item) { item.removeAttribute('id'); });
            tocPanel.querySelector('summary').removeAttribute('accesskey');
            tocPanel.querySelector('summary').removeAttribute('title');
            tocPanel.querySelector('summary').textContent = '文章目录 · 关闭';
            tocPanel.open = true;
            tocPanel.hidden = true;
            document.body.appendChild(tocPanel);
            header.classList.add('has-mobile-toc');
        }

        var closeMenu = function (restoreFocus) {
            header.classList.remove('is-menu-open');
            menuButton.setAttribute('aria-expanded', 'false');
            menuButton.setAttribute('aria-label', '打开导航菜单');
            if (restoreFocus) menuButton.focus({ preventScroll: true });
        };
        var closeToc = function (restoreFocus) {
            if (!tocPanel || tocPanel.hidden) return;
            tocPanel.hidden = true;
            tocButton.setAttribute('aria-expanded', 'false');
            tocButton.setAttribute('aria-label', '打开文章目录');
            if (restoreFocus) tocButton.focus({ preventScroll: true });
        };
        menuButton.addEventListener('click', function () {
            closeToc(false);
            var open = !header.classList.contains('is-menu-open');
            header.classList.toggle('is-menu-open', open);
            menuButton.setAttribute('aria-expanded', String(open));
            menuButton.setAttribute('aria-label', open ? '关闭导航菜单' : '打开导航菜单');
            /* 展开一级菜单时直接展示栏目，避免手机上再点一次分组。 */
            menu.querySelectorAll('.nav-dropdown').forEach(function (item) { item.open = open; });
        });
        menu.querySelectorAll('a').forEach(function (link) {
            link.addEventListener('click', function () { if (mobile.matches) closeMenu(false); });
        });
        if (tocPanel && tocButton) {
            tocButton.addEventListener('click', function () {
                if (!tocPanel.hidden) { closeToc(true); return; }
                closeMenu(false);
                tocPanel.hidden = false;
                tocButton.setAttribute('aria-expanded', 'true');
                tocButton.setAttribute('aria-label', '关闭文章目录');
                tocPanel.querySelector('summary').focus({ preventScroll: true });
            });
            tocPanel.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { closeToc(false); });
            });
            tocPanel.querySelector('summary').addEventListener('click', function (event) {
                event.preventDefault();
                closeToc(true);
            });
            tocPanel.addEventListener('focusout', function (event) {
                if (event.relatedTarget && !tocPanel.contains(event.relatedTarget) && event.relatedTarget !== tocButton) closeToc(false);
            });
        }
        document.addEventListener('click', function (event) {
            if (!header.contains(event.target)) closeMenu(false);
            if (tocPanel && !tocPanel.contains(event.target) && !tocButton.contains(event.target)) closeToc(false);
        });
        document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape') return;
            if (tocPanel && !tocPanel.hidden) { closeToc(true); event.preventDefault(); }
            else if (header.classList.contains('is-menu-open')) { closeMenu(true); event.preventDefault(); }
        });
        header.addEventListener('focusout', function (event) {
            if (event.relatedTarget && !header.contains(event.relatedTarget)) closeMenu(false);
        });
        var reset = function () { closeMenu(false); closeToc(false); };
        if (mobile.addEventListener) mobile.addEventListener('change', reset);
        else mobile.addListener(reset);
    })();

    /* 原生 details 支持触屏与键盘；补上外部点击、焦点离开和 Esc 收起。 */
    (function () {
        var dropdowns = document.querySelectorAll('.nav-dropdown');
        dropdowns.forEach(function (dropdown) {
            document.addEventListener('click', function (event) {
                if (!dropdown.contains(event.target) && !event.target.closest('.mobile-menu-toggle')) dropdown.open = false;
            });
            dropdown.addEventListener('focusout', function (event) {
                if (!dropdown.contains(event.relatedTarget)) dropdown.open = false;
            });
            dropdown.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && dropdown.open) {
                    dropdown.open = false;
                    dropdown.querySelector('summary').focus();
                    event.preventDefault();
                }
            });
            dropdown.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { dropdown.open = false; });
            });
        });
    })();

    /* 吸顶导航：滚动后才出现分隔线，静止时保持干净。 */
    (function () {
        var header = document.querySelector('.header');
        if (!header) return;
        var onScroll = function () {
            header.classList.toggle('is-stuck', window.scrollY > 4);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
    })();

    /* 目录：≥1280px 时它被 CSS 挪到右侧栏，这时默认展开才有意义；
       窄屏回落到内联折叠块，保持原来的行为。
       只在断点切换时同步，所以用户手动折叠的状态不会被反复覆盖。
       同时挂载滚动监听，高亮当前阅读章节。 */
    (function () {
        var toc = document.querySelector('details.toc');
        if (!toc || !window.matchMedia) return;
        /* 右目录已移除（≥1280 隐藏）；移动端内联目录默认收起，无需断点同步。 */

        var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
        var items = [];
        links.forEach(function (link) {
            var raw = link.getAttribute('href').slice(1);
            if (!raw) return;
            var id = raw;
            try { id = decodeURIComponent(raw); } catch (e) {}
            var target = document.getElementById(id);
            if (target) items.push({ link: link, target: target, href: link.getAttribute('href') });
        });
        if (!items.length) return;

        var mobilePanel = document.getElementById('article-toc');
        var mobileLinks = mobilePanel ? Array.prototype.slice.call(mobilePanel.querySelectorAll('a[href^="#"]')) : [];
        var activeHref = '';
        var ticking = false;

        var updateActive = function () {
            ticking = false;
            var threshold = 116;
            var current = items[0];
            for (var i = 0; i < items.length; i++) {
                if (items[i].target.getBoundingClientRect().top <= threshold) {
                    current = items[i];
                } else {
                    break;
                }
            }
            var nextHref = current ? current.href : '';
            if (nextHref === activeHref) return;
            activeHref = nextHref;
            items.forEach(function (item) {
                item.link.classList.toggle('is-active', item.href === activeHref);
            });
            mobileLinks.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('href') === activeHref);
            });
        };

        window.addEventListener('scroll', function () {
            if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(updateActive);
            }
        }, { passive: true });
        updateActive();
    })();

    /* 导图已完成阶段抽屉与里程碑明细抽屉：点击上方进度条节点时，自动展开所在阶段及目标里程碑明细并定位。 */
    (function () {
        document.addEventListener('click', function (event) {
            var link = event.target.closest && event.target.closest('a.roadmap-step[href^="#"]');
            if (!link) return;
            var id = link.getAttribute('href').slice(1);
            if (!id) return;
            var target = document.getElementById(id);
            if (!target) return;
            var drawer = target.closest('details.roadmap-phase-drawer');
            if (drawer && !drawer.open) {
                drawer.open = true;
            }
            var msDetails = target.querySelector('details.ms-details');
            if (msDetails && !msDetails.open) {
                msDetails.open = true;
            }
        });
    })();

    /* 本站覆盖的 footer 未带入主题脚本，因此在扩展挂载点补回明暗切换。 */
    (function () {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        toggle.addEventListener('click', function () {
            var root = document.documentElement;
            var theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = theme;
            localStorage.setItem('pref-theme', theme);
        });
    })();

    /* 没有手动偏好时持续跟随系统；一旦使用顶栏切换，就尊重本地选择。 */
    (function () {
        if (!window.matchMedia || {{ ne (site.Params.defaultTheme | default "auto") "auto" }}) return;
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
        var follow = function (event) {
            if (!localStorage.getItem('pref-theme')) {
                document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
            }
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', follow);
        else systemTheme.addListener(follow);
    })();

    /* giscus 首次加载跟随系统，之后与站点的手动切换保持同步。 */
    (function () {
        var root = document.documentElement;
        var sync = function () {
            var frame = document.querySelector('iframe.giscus-frame');
            if (!frame) return;
            var theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
            frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
        };
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
        var comments = document.getElementById('comments');
        if (comments) new MutationObserver(sync).observe(comments, { childList: true, subtree: true });
        document.addEventListener('load', function (event) {
            if (event.target instanceof Element && event.target.matches('iframe.giscus-frame')) sync();
        }, true);
        sync();
    })();

    /* Roadmap 展示重构：粘性阶段轨 / 阶段折叠 / 卡片·矩阵双视图 / 节点与卡片联动。
       仅表现层增强，不改内容；无 JS 时回落到原有抽屉与卡片。 */
    (function () {
        var root = document.querySelector('.post-content.md-content');
        if (!root) return;
        var consoles = Array.prototype.slice.call(root.querySelectorAll('section.roadmap-console[id]'));
        if (!consoles.length) return;

        var stateOf = function (c) {
            if (c.classList.contains('is-phase-done')) return 'done';
            if (c.classList.contains('is-phase-active')) return 'active';
            return 'planning';
        };
        var stVar = { done: '--st-done', active: '--st-next', planning: '--st-planning' };
        var statOf = function (c) {
            var s = c.querySelector('.roadmap-console-stat strong');
            return s ? s.textContent.trim() : '';
        };
        var titleOf = function (c) {
            var t = c.querySelector('.roadmap-phase-title');
            return t ? t.textContent.trim() : c.id;
        };

        var first = consoles[0];
        var toolbar = document.createElement('div');
        toolbar.className = 'roadmap-toolbar';
        toolbar.innerHTML =
            '<div class="roadmap-legend">' +
            [['done', '已验收', '--st-done'], ['next', '下一站', '--st-next'], ['todo', '待开工', '--st-todo'], ['optional', '可选', '--st-optional'], ['planning', '规划中', '--st-planning']].map(function (p) {
                return '<span class="roadmap-legend-item is-' + p[0] + '" style="--st: var(' + p[2] + ')"><i></i>' + p[1] + '</span>';
            }).join('') +
            '</div>' +
            '<div class="roadmap-view-toggle" role="group" aria-label="视图切换">' +
            '<button type="button" data-view="card" class="is-on">卡片视图</button>' +
            '<button type="button" data-view="matrix">矩阵视图</button>' +
            '</div>';
        var rail = document.createElement('nav');
        rail.className = 'phase-rail';
        rail.setAttribute('aria-label', '阶段导航');
        var matrix = document.createElement('div');
        matrix.className = 'roadmap-matrix';
        first.parentNode.insertBefore(toolbar, first);
        first.parentNode.insertBefore(rail, first);
        first.parentNode.insertBefore(matrix, first);

        consoles.forEach(function (c) {
            var st = stateOf(c);
            var a = document.createElement('a');
            a.className = 'phase-rail-item' + (st === 'active' ? ' is-active' : '');
            a.href = '#' + c.id;
            a.style.setProperty('--st', 'var(' + stVar[st] + ')');
            a.innerHTML = '<i></i><span>' + titleOf(c) + '</span><strong>' + statOf(c) + '</strong>';
            rail.appendChild(a);
        });

        var bodies = {};
        var toggles = {};
        consoles.forEach(function (c, i) {
            var stop = consoles[i + 1] || null;
            var els = [];
            var n = c.nextElementSibling;
            while (n && n !== stop) {
                if (n.tagName === 'H2' && /支线探索/.test(n.textContent)) break;
                els.push(n);
                n = n.nextElementSibling;
            }
            bodies[c.id] = els;
            var st = stateOf(c);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'phase-toggle';
            c.parentNode.insertBefore(btn, c.nextSibling);
            toggles[c.id] = btn;
            var setOpen = function (open) {
                els.forEach(function (el) { el.hidden = !open; });
                c.classList.toggle('is-collapsed', !open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                btn.innerHTML = '<span>' + titleOf(c) + ' · ' + (st === 'done' ? '已完成' : st === 'active' ? '进行中' : '规划中') + ' ' + statOf(c) + '</span><span class="phase-toggle-hint">' + (open ? '收起 ▴' : '展开 ▾') + '</span>';
            };
            btn.addEventListener('click', function () { setOpen(btn.getAttribute('aria-expanded') !== 'true'); });
            setOpen(st === 'active');
            els.forEach(function (el) { el.setAttribute('data-phasebody', c.id); });
        });
        var openPhase = function (id) {
            var btn = toggles[id];
            if (btn && btn.getAttribute('aria-expanded') !== 'true') btn.click();
        };

        consoles.forEach(function (c) {
            var steps = Array.prototype.slice.call(c.querySelectorAll('.roadmap-stepper .roadmap-step'));
            if (!steps.length) return;
            var row = document.createElement('div');
            row.className = 'matrix-phase';
            var label = document.createElement('div');
            label.className = 'matrix-phase-label';
            label.innerHTML = '<span>' + titleOf(c) + '</span><strong>' + statOf(c) + '</strong>';
            var cells = document.createElement('div');
            cells.className = 'matrix-cells';
            cells.style.gridTemplateColumns = 'repeat(' + steps.length + ', minmax(0,1fr))';
            steps.forEach(function (s) {
                var status = (s.className.match(/is-(done|next|todo|optional|planning)/) || [])[1] || 'todo';
                var code = s.querySelector('.roadmap-step-code');
                var name = s.querySelector('.roadmap-step-name');
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'matrix-cell is-' + status;
                b.textContent = code ? code.textContent.trim() : '';
                b.title = name ? name.textContent.trim() : '';
                b.setAttribute('data-target', (s.getAttribute('href') || '').slice(1));
                cells.appendChild(b);
            });
            row.appendChild(label);
            row.appendChild(cells);
            matrix.appendChild(row);
        });

        var setView = function (mode) {
            document.body.classList.toggle('roadmap-matrix-mode', mode === 'matrix');
            toolbar.querySelectorAll('.roadmap-view-toggle button').forEach(function (b) {
                b.classList.toggle('is-on', b.getAttribute('data-view') === mode);
            });
        };
        toolbar.querySelectorAll('.roadmap-view-toggle button').forEach(function (b) {
            b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
        });

        var goto = function (id) {
            var target = document.getElementById(id);
            if (!target) return;
            setView('card');
            var holder = target.closest('[data-phasebody]');
            var pid = holder && holder.getAttribute('data-phasebody');
            if (pid) openPhase(pid);
            var d = target.querySelector('details.ms-details');
            if (d) d.open = true;
            var drawer = target.closest('details.roadmap-phase-drawer');
            if (drawer) drawer.open = true;
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        matrix.addEventListener('click', function (e) {
            var cell = e.target.closest('.matrix-cell');
            if (cell) goto(cell.getAttribute('data-target'));
        });
        rail.addEventListener('click', function (e) {
            var a = e.target.closest('.phase-rail-item');
            if (!a) return;
            rail.querySelectorAll('.phase-rail-item').forEach(function (x) { x.classList.remove('is-active'); });
            a.classList.add('is-active');
        });
        root.addEventListener('click', function (e) {
            var step = e.target.closest('a.roadmap-step[href^="#"]');
            if (step) {
                var t = document.getElementById(step.getAttribute('href').slice(1));
                if (t) { var h = t.closest('[data-phasebody]'); var pid = h && h.getAttribute('data-phasebody'); if (pid) openPhase(pid); }
                return;
            }
            var head = e.target.closest('.ms-card-head');
            if (head && !e.target.closest('a')) {
                var card = head.closest('.ms-card');
                var dd = card && card.querySelector('details.ms-details');
                if (dd) dd.open = !dd.open;
            }
        });
        if (window.location.hash === '#matrix') setView('matrix');
    })();
</script>
